<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>/* 🌗 주야간 */try{var _t=localStorage.getItem("dg_theme");if(_t==="dark"||_t==="light")document.documentElement.setAttribute("data-theme",_t);}catch(e){}</script>
<title>계정 삭제 — 단골창구</title>
<meta name="theme-color" content="#123F3D">
<link rel="icon" href="icon_192.png"><link rel="stylesheet" href="dg.css?v=20261116">
<!-- 🏪 2026-11-15 단골창구 계정 삭제 (구글 플레이 「계정 삭제 URL」). 가림 서버 self-delete-account 함수(가림콜과 같음). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="dangol_i18n.js?v=20261122a"></script>
</head>
<body>
<a href="home.html" class="dgHomeLink" style="display:inline-block;margin:max(10px, env(safe-area-inset-top, 0px)) 0 0 max(16px, env(safe-area-inset-left, 0px));padding:8px 14px;border-radius:20px;background:#E4EFEE;color:#123F3D;font-weight:800;font-size:14px;text-decoration:none;font-family:system-ui,sans-serif">‹ 단골창구 처음으로</a>
<div class="w">
  <div class="top"><a class="logo" href="./"><img src="icon_192.png" alt="">단골창구</a></div>
  <section class="card">
    <b class="h">계정 삭제</b>
    <p>계정을 지우면 <b>내 단골창구 · 손님과의 대화 · 남은 기간</b>이 모두 지워지고 되돌릴 수 없습니다. 결제 기록은 법에 따라 5년 보관됩니다.</p>
    <p>⚠ 가림콜과 같은 계정이라, 가림콜에서 쓰시던 것도 함께 지워집니다.</p>
    <div id="out"><p>확인 중…</p></div>
    <div class="err" id="err" hidden></div>
    <p style="font-size:13px">로그인이 안 되면 weapps.kr@gmail.com 으로 닉네임과 함께 삭제를 요청해 주세요. 7일 안에 처리합니다.</p>
  </section>
</div>
<script>
(async function(){
  var URL0 = 'https://qmwaraittiurkynszjts.supabase.co';
  var sb = window.supabase.createClient(URL0, 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFtd2FyYWl0dGl1cmt5bnN6anRzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3ODQ5OTUsImV4cCI6MjEwMjM2MDk5NX0.9Qr2vFzDCSKS54N6C5QN44BvCzIPTMQyVz7nX3GqT9Y');
  var $ = function(id){ return document.getElementById(id); };
  var s = (await sb.auth.getSession()).data.session;
  if (!s) { $('out').innerHTML = '<a class="btn" href="login.html?next=delete.html">먼저 로그인하기</a>'; return; }
  $('out').innerHTML = '<label style="display:flex;gap:8px;align-items:flex-start;font-weight:700;color:var(--ink)"><input type="checkbox" id="ok" style="width:auto;margin-top:5px"> 위 내용을 확인했고, 계정을 지웁니다.</label>' +
    '<button class="btn c" id="go" type="button" disabled style="margin-top:10px">계정 지우기</button>';
  $('ok').onchange = function(){ $('go').disabled = !this.checked; };
  $('go').onclick = async function(){
    this.disabled = true; this.textContent = '지우는 중…';
    try {
      var r = await fetch(URL0 + '/functions/v1/self-delete-account', { method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + s.access_token }, body: JSON.stringify({ reason: 'dangol' }) });
      var d = {}; try { d = await r.json(); } catch (x) {}
      if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
      await sb.auth.signOut();
      $('out').innerHTML = '<p><b>계정을 지웠습니다.</b> 그동안 단골창구를 써 주셔서 고맙습니다.</p>';
    } catch (e) { $('err').textContent = '지우지 못했어요: ' + (e.message || e); $('err').hidden = false; this.disabled = false; this.textContent = '계정 지우기'; }
  };
})();
</script>
<script>/* 🌗 주야간 바꾸기 단추 (2026-11-16) — 고른 값은 이 휴대폰에만 기억합니다 */
(function(){ var R = document.documentElement;
  function dark(){ var t = R.getAttribute('data-theme'); return t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
  var b = document.createElement('button'); b.type = 'button'; b.id = 'dgTheme';
  b.style.cssText = 'flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line,#DCE3DE);background:var(--card,#fff);color:var(--ink,#12302E);font-size:18px;line-height:1;cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12)';
  function paint(){ var d = dark(); b.textContent = d ? '☀️' : '🌙'; b.title = b.ariaLabel = d ? '주간 모드로' : '야간 모드로'; }
  b.onclick = function(){ var t = dark() ? 'light' : 'dark'; R.setAttribute('data-theme', t); try { localStorage.setItem('dg_theme', t); } catch (e) {} paint(); };
  paint(); var top = document.querySelector('.top');
  if (top) { b.style.marginLeft = 'auto'; top.appendChild(b); }
  else { var bar = document.createElement('div');   /* 위쪽 띠가 없는 화면: 맨 위 오른쪽에 한 줄 */
    bar.style.cssText = 'max-width:640px;margin:0 auto -6px;padding:max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));display:flex;justify-content:flex-end';
    b.style.width = b.style.height = '34px'; b.style.fontSize = '16px'; bar.appendChild(b); document.body.insertBefore(bar, document.body.firstChild); }
})();
</script>
</body>
</html>
